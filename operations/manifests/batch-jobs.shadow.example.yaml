schemaVersion: ops.chumji/v1alpha1
metadata:
  name: batch-jobs-shadow-example
  status: example-only
  issue: sw326/openclaw_v2#16
approval:
  requiredBefore:
    - source-import
    - production-credential-use
    - shadow-run-against-production-data
    - scheduler-change
    - cutover
    - rollback
defaults:
  enabled: false
  mode: shadow
  publish: false
  productionDestinations: false
secretRefs:
  - name: fresh-food.source.api
    provider: macos-keychain
    scope: local-ops-shadow
    owner: ops
    lookup: chumji-ops/fresh-food/source-api
    rotation: approval-required
  - name: fresh-food.vercel.preview
    provider: vercel
    scope: preview-only
    owner: ops
    lookup: chumji-ops/fresh-food/vercel-preview
    rotation: approval-required
  - name: fresh-food.supabase.preview
    provider: supabase-vault
    scope: preview-only
    owner: ops
    lookup: chumji-ops/fresh-food/supabase-preview
    rotation: approval-required
  - name: global-intel.model.api
    provider: macos-keychain
    scope: local-ops-shadow
    owner: ops
    lookup: chumji-ops/global-intel/model-api
    rotation: approval-required
  - name: global-intel.telegram.destination
    provider: macos-keychain
    scope: cutover-only
    owner: ops
    lookup: chumji-ops/global-intel/telegram-destination
    rotation: approval-required
jobs:
  freshFood:
    contract: jobs/fresh-food/contract.md
    schedule:
      status: inactive
      cadence: inventory-confirmed
    modelPolicy: fresh-food.normalizer.model.default
    apis:
      - fresh-food.sources.http
      - fresh-food.preview.build
    secrets:
      - fresh-food.source.api
      - fresh-food.vercel.preview
      - fresh-food.supabase.preview
    guiLoginDependency: false
    duplicateKey: fresh-food:{market}:{observedDate}:{sourceId}
    cutoverGate: explicit-approval-required
  globalIntel:
    contract: jobs/global-intel/contract.md
    schedule:
      status: inactive
      cadence: inventory-confirmed
    modelPolicy: global-intel.briefing.model.default
    apis:
      - global-intel.sources.http
      - global-intel.model.api
    secrets:
      - global-intel.model.api
      - global-intel.telegram.destination
    guiLoginDependency: false
    duplicateKey: global-intel:{inputWindowStart}:{inputWindowEnd}
    cutoverGate: explicit-approval-required
